[project]
name = "record-finder-ocr"
version = "0.1.0"
description = "Isolated OCR worker for synthetic record rendering"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]

[project.scripts]
record-finder-ocr = "record_finder_ocr.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
