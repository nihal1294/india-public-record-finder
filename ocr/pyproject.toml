[project]
name = "record-finder-ocr"
version = "0.1.0"
description = "Isolated OCR worker for synthetic record rendering"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow>=13.0.0",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
record-finder-ocr = "record_finder_ocr.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
constraint-dependencies = [
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "aiohttp>=3.14.4",
    "multidict>=6.9.1",
    "setuptools>=84.1.0",
]
