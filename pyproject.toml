[project]
name = "record-finder"
version = "0.1.0"
description = "Synthetic-only tools for finding public records in India"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdfium2>=5.13.0",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.1.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
record-finder = "record_finder.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
deploy = [
    "modal==1.5.4",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["record_finder"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.14"
strict = true
